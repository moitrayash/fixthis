<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>Fix This · City Portal</title>
<link rel="icon" type="image/svg+xml" href="assets/crest.svg" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{
    --ink:#111;--paper:#f4f1ea;--paper-2:#ebe5d6;--line:#c9bfa6;--muted:#6b7280;
    --red:#b91c1c;--red-bg:#fee2e2;--ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  body{min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:transparent}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 4px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .crest{display:flex;align-items:center;gap:10px;font-weight:700}
  .crest svg{width:28px;height:28px}
  .crest small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .who{font-size:13px;color:var(--muted);text-align:right}
  .who strong{display:block;color:var(--ink);font-size:14px}
  .who a{color:var(--red);text-decoration:none}

  .login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  .login .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:min(420px,94vw);box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .login h1{margin:0 0 8px;font-size:26px;font-weight:800}
  .login p{margin:0 0 18px;color:var(--muted)}
  .login label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
  .login input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:16px;margin-bottom:14px}
  .login input:focus{border-color:var(--ink)}
  .login button.primary{background:var(--ink);color:#fff;font-weight:700;padding:14px;border-radius:12px;width:100%;font-size:16px}
  .login .err{background:var(--red-bg);color:#991b1b;padding:12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .login .help{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .login .hints{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);background:var(--paper-2);padding:10px;border-radius:8px;line-height:1.5}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
  .toolbar input{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:14px;flex:1;min-width:160px;max-width:280px}
  .view-toggle{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .view-toggle button{padding:7px 14px;font-size:12px;font-weight:700;border-radius:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .view-toggle button.active{background:var(--ink);color:#fff}
  .stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .stat{background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .stat strong{color:var(--ink);font-size:18px;display:block;font-weight:800;line-height:1.1}

  .board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1;overflow:hidden;align-items:stretch;min-height:0}
  .col{background:transparent;border-radius:14px;display:flex;flex-direction:column;border:2px dashed transparent;transition:border-color .15s, background .15s}
  .col.drag-over{border-color:rgba(0,0,0,.3);background:rgba(255,255,255,.4)}
  .col-head{padding:10px 14px;border-radius:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .col[data-status="Open"]         .col-head{background:#dc2626;color:#fff}
  .col[data-status="In Progress"]  .col-head{background:#f59e0b;color:#1f2937}
  .col[data-status="Resolved"]     .col-head{background:#16a34a;color:#fff}
  .col-head .count{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;font-size:12px}
  .col[data-status="In Progress"] .col-head .count{background:rgba(0,0,0,.12)}

  .col-list{overflow-y:auto;flex:1;padding:4px;display:flex;flex-direction:column;gap:14px;min-height:120px}
  .col-list::before{content:"";display:block;height:2px;background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);margin-bottom:6px}

  .receipt{background:#fffdf6;border:1px solid #d6cdb1;border-radius:6px;padding:14px 14px 12px;box-shadow:0 1px 0 rgba(0,0,0,.04), 0 6px 12px rgba(0,0,0,.08), inset 0 0 0 1px rgba(255,255,255,.5);cursor:grab;position:relative;transition:transform .12s, box-shadow .12s;user-select:none;-webkit-user-select:none;background-image:radial-gradient(circle at 6px 100%, transparent 4px, #fffdf6 4.5px), linear-gradient(#fffdf6,#fffdf6)}
  .receipt:nth-child(odd){transform:rotate(-.6deg)}
  .receipt:nth-child(3n){transform:rotate(.4deg)}
  .receipt:hover{transform:rotate(0) translateY(-2px);box-shadow:0 2px 0 rgba(0,0,0,.04), 0 10px 20px rgba(0,0,0,.12)}
  .receipt.dragging{opacity:.4;cursor:grabbing}
  .receipt::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:6px;background-image:radial-gradient(circle at 6px 0, var(--paper) 3.5px, transparent 4px);background-size:12px 6px;background-repeat:repeat-x}
  .receipt .id{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .receipt .dept{font-weight:800;font-size:11px;color:#000;letter-spacing:.06em}
  .receipt .photo{width:100%;aspect-ratio:4/3;background:#000;border-radius:3px;margin-bottom:8px;background-size:cover;background-position:center}
  .receipt .photo.empty{background:repeating-linear-gradient(45deg, #e7e0c8 0 6px, #f0e9cf 6px 12px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;font-style:italic}
  .receipt p.desc{margin:0 0 8px;font-size:14px;font-weight:600;line-height:1.3}
  .receipt .meta-line{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:#444;display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
  .receipt .meta-line strong{color:#000;font-weight:700}
  .receipt .urgent{background:var(--red);color:#fff;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
  .receipt .actions-row{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:6px}
  .receipt .actions-row a, .receipt .actions-row button{flex:1;padding:6px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;text-align:center;background:#000;color:#fff;border:1px solid #000}
  .receipt .actions-row .ghost{background:transparent;color:#000;border:1px solid #000}
  .receipt .actions-row a:active, .receipt .actions-row button:active{transform:translateY(1px)}

  .col-empty{color:var(--muted);font-size:12px;text-align:center;padding:30px 10px;font-style:italic;border:2px dashed var(--line);border-radius:8px;background:rgba(255,255,255,.3)}

  /* --- Map view --- */
  .map-pane{flex:1;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:500px}
  #leafletMap{flex:1;background:#dde2d8}
  .map-legend{display:flex;gap:14px;padding:10px 14px;background:#fff;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
  .map-legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .map-legend .dot.open{background:#dc2626}
  .map-legend .dot.progress{background:#f59e0b}
  .map-legend .dot.resolved{background:#16a34a}
  .leaflet-popup-content{margin:10px 12px;font-family:inherit;font-size:13px;line-height:1.4}
  .leaflet-popup-content strong{display:block;font-size:12px;color:#000;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
  .leaflet-popup-content .pop-id{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--muted);margin-top:6px}
  .leaflet-popup-content img{max-width:200px;border-radius:4px;margin-top:6px;display:block}

  /* Custom marker icons via CSS */
  .marker-pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);position:relative}
  .marker-pin.open{background:#dc2626}
  .marker-pin.progress{background:#f59e0b}
  .marker-pin.resolved{background:#16a34a}
  .marker-pin::after{content:"";position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;left:5px;top:5px}

  /* --- Mobile action sheet --- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 16px calc(var(--safe-b) + 20px);display:flex;flex-direction:column;gap:10px}
  .sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
  .sheet .opt{padding:18px;border-radius:12px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);background:#fff}
  .sheet .opt[data-status="Open"]        {border-color:#dc2626;color:#dc2626}
  .sheet .opt[data-status="In Progress"] {border-color:#f59e0b;color:#92400e}
  .sheet .opt[data-status="Resolved"]    {border-color:#16a34a;color:#166534}
  .sheet .opt.current{background:var(--paper-2);opacity:.6}
  .sheet .cancel{padding:14px;color:var(--muted);text-align:center;font-size:14px}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;cursor:zoom-out}
  .modal img{max-width:96vw;max-height:90vh;border-radius:6px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 24px);background:#000;color:#fff;padding:12px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:70;display:flex;align-items:center}

  /* Trash button on receipts */
  .receipt .actions-row .ghost.danger{color:var(--red);border-color:var(--red);font-weight:800}
  .receipt .actions-row .ghost.danger:hover{background:var(--red-bg)}
  .receipt.trashed{opacity:.92;background-image:repeating-linear-gradient(45deg, #fffdf6 0 10px, #f7f0d8 10px 12px)}
  .receipt.trashed .actions-row .restore-btn{background:var(--ok);color:#fff;border:1px solid var(--ok);flex:1;padding:6px 8px;border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}

  /* Trash view pane */
  .trash-pane{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
  .trash-note{margin:0;padding:12px 16px;background:var(--warn-bg);border:1px solid #fde68a;border-radius:10px;color:#78350f;font-size:13px;line-height:1.5}
  .trash-note em{font-style:normal;font-weight:700;background:#fff;padding:1px 6px;border-radius:4px}
  .trash-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .trash-empty{padding:60px 24px;text-align:center;color:var(--muted);background:var(--paper-2);border-radius:14px;border:2px dashed var(--line)}
  .trash-empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:8px;font-weight:800}
  .trash-empty p{margin:0;max-width:48ch;margin-left:auto;margin-right:auto;font-size:13px;line-height:1.5}
  .trash-empty em{font-style:normal;font-weight:700;color:var(--ink)}

  /* Sheet trash option */
  .sheet .opt-trash{border-color:var(--red) !important;color:var(--red) !important}

  footer{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  footer a{color:var(--muted)}

  @media (max-width:760px){
    .board{grid-template-columns:1fr;gap:18px;overflow:visible}
    .col-list{max-height:none;min-height:60px}
    .receipt{cursor:pointer}
    .receipt:nth-child(odd){transform:none}
    .receipt:nth-child(3n){transform:none}
    .map-pane{min-height:400px}
  }
</style>
</head>
